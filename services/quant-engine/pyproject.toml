[project]
name = "quant-engine"
version = "0.1.0"
description = "High-performance vectorized quantitative computing service for QuantAI"
authors = [{ name = "Yuvaraj Pattabi", email = "yuva.devlab@gmail.com" }]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "numpy>=2.1.0",
    "scipy>=1.14.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
